name: Build Rust Office Windows x64
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build static Next.js frontend
        run: npm run build
      - name: Verify Tauri workspace configuration
        shell: pwsh
        run: |
          cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 > $null
      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Build portable Windows EXE
        run: npm run tauri -- build --no-bundle
      - name: Package portable application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'src-tauri/target/release/rust-office-modern.exe'
          if (!(Test-Path $exe)) { throw "EXE missing: $exe" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe 'dist/RustOfficeModern.exe'
          Copy-Item README.md 'dist/README.md'
          Compress-Archive -Path 'dist/*' -DestinationPath 'RustOfficeModern-Windows-x64-portable.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: RustOfficeModern-Windows-x64-portable
          path: RustOfficeModern-Windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 30
