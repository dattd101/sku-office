name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows x64 release
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check source
        run: cargo check --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Build release EXE
        run: cargo build --release --target x86_64-pc-windows-msvc --bin rust-office-desktop

      - name: Package Windows binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item 'target/x86_64-pc-windows-msvc/release/rust-office-desktop.exe' 'dist/rust-office-desktop.exe'
          Copy-Item 'README.md' 'dist/README.md'
          Compress-Archive -Path 'dist/*' -DestinationPath 'rust-office-windows-x64.zip' -Force
          if (-not (Test-Path 'rust-office-windows-x64.zip')) { throw 'ZIP was not created' }

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-office-windows-x64
          path: rust-office-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" 'rust-office-windows-x64.zip' --generate-notes --verify-tag
